function legacyUpdateStatus(t,s){if(s==='In progress'){showDialog('Update progress',`<form id="progress-form"><p class="muted mb">How much of “${esc(t.title)}” is complete?</p><div class="field"><label for="percent-range">Progress</label><input type="range" id="percent-range" min="5" max="95" step="5" value="${Math.min(95,Math.max(5,t.percent))}" style="padding:0;accent-color:#1f6fb5"><div class="flex"><input type="number" id="percent-number" name="percent" min="1" max="99" required value="${Math.min(95,Math.max(5,t.percent))}" style="width:100px"><span>% complete</span></div><small>Enter a percentage between 1 and 99.</small></div><div id="form-error" class="error-text" role="alert"></div></form>`,`${cancelBtn}<button class="btn primary" form="progress-form">Save progress</button>`);document.getElementById('percent-range').oninput=e=>document.getElementById('percent-number').value=e.target.value;document.getElementById('percent-number').oninput=e=>document.getElementById('percent-range').value=e.target.value;document.getElementById('progress-form').onsubmit=e=>{e.preventDefault();t.status='In progress';t.percent=Number(new FormData(e.target).get('percent'));delete t.reason;t.declined=false;log('Progress updated',t.title);closeDialog();render();toast('Progress saved.')}}else if(s==='Blocked'){reasonDialog('What is blocking this task?','Describe what’s stopping you.',reason=>{t.status='Blocked';t.percent=0;t.reason=reason;log('Task blocked',t.title);render();blockedNext(t)},1,'Save blocker')}else if(s==='Completed'){showDialog('Mark this task as completed?',`<p class="muted">${t.employee==='Tunde Bakare'?'Your task will be auto-approved and visible to leadership.':'It will be sent to Tunde Bakare for approval. Until approved, it won’t count towards your completion rate.'}</p><div class="banner gray mt" style="margin-bottom:0">${icon('file')} ${esc(t.title)}</div>`,`${cancelBtn}<button class="btn primary" id="confirm-complete">${icon('check')} Mark completed</button>`);document.getElementById('confirm-complete').onclick=()=>{t.previousPercent=t.percent;t.status=t.employee==='Tunde Bakare'?'Completed':'Awaiting approval';t.percent=100;delete t.reason;t.declined=false;log('Completion submitted',t.title);closeDialog();render();toast(t.employee==='Tunde Bakare'?'Completed and auto-approved.':'Sent to Tunde Bakare for approval.')}}else{t.status='Pending';t.percent=0;delete t.reason;t.declined=false;log('Task status updated',t.title);closeDialog();render();toast('Task set to Pending.')}}
function reasonDialog(title,desc,done,min=10,label='Save'){showDialog(title,`<form id="reason-form"><p class="muted mb">${desc}</p><div class="field"><label for="reason-text">Reason</label><textarea id="reason-text" name="reason" required minlength="${min}" placeholder="Add a clear reason…"></textarea><small>${min>1?'At least '+min+' characters.':''}</small></div></form>`,`${cancelBtn}<button class="btn primary" form="reason-form">${label}</button>`);document.getElementById('reason-form').onsubmit=e=>{e.preventDefault();let reason=new FormData(e.target).get('reason').trim();if(reason.length<min)return;done(reason)}}
function blockedNext(t){showDialog('What would you like to do next?',`<p class="muted mb">Your blocker is saved. Choose what happens to this task.</p><div class="stack"><button class="quick-link" id="carry-blocked">${icon('relief')}<span class="grow"><strong>Carry over to next week</strong><small>Keep the task and its blocker visible.</small></span>${icon('chevron')}</button><button class="quick-link" id="delete-blocked">${icon('trash')}<span><strong>Delete task</strong><small>Remove it from your weekly plan.</small></span></button></div>`,cancelBtn);document.getElementById('carry-blocked').onclick=()=>{t.carry=true;log('Blocked task carried over',t.title);closeDialog();render();toast('Task will carry into next week.')};document.getElementById('delete-blocked').onclick=()=>confirmDelete(t)}
function confirmDelete(t){
 showDialog('Delete this task?',`<p class="muted">“${esc(t.title)}” will be removed. This cannot be undone.</p>`,`${cancelBtn}<button class="btn danger" id="confirm-delete">${icon('trash')} Delete task</button>`,false,'sm');
 document.getElementById('confirm-delete').onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);log('Task deleted',t.title);closeDialog();render();toast('Task deleted.');};
}
function confirmComplete(t){
 showDialog('Complete this task?',`
  <p class="muted mb" style="font-size:13px;line-height:1.4;">Are you sure you want to mark “<strong>${esc(t.title)}</strong>” as completed?</p>
  <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;color:#166534;font-size:12px;line-height:1.4;">
    <span style="flex-shrink:0;margin-top:1px;">${icon('check')}</span>
    <span>Progress will be updated to 100% and submitted for manager review and sign-off.</span>
  </div>
 `,`${cancelBtn}<button class="btn primary" id="confirm-complete-btn" style="background:#166534;border-color:#166534;">${icon('check')} Mark completed</button>`,false,'sm');
 let btn=document.getElementById('confirm-complete-btn');
 if(btn){
  btn.onclick=()=>{
   t.status=t.employee==='Tunde Bakare'?'Completed':'Awaiting approval';
   t.percent=100;
   delete t.reason;
   t.declined=false;
   log('Completion submitted',t.title);
   save();
   closeDialog();
   render();
   toast(`“${t.title}” marked as completed.`);
  };
 }
}
function confirmInProgress(t){
 let currentPercent=(t.percent&&t.percent<100)?t.percent:50;
 showDialog('Update progress level',`
  <form id="progress-form" onsubmit="return false;">
    <p class="muted mb" style="font-size:13px;line-height:1.4;">Set “<strong>${esc(t.title)}</strong>” in progress and update its current completion level:</p>
    <div class="field" style="margin-top:14px;margin-bottom:4px;">
      <label for="progress-percent-input" style="font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block;">Progress level (%)</label>
      <div style="position:relative;display:flex;align-items:center;">
        <input type="number" id="progress-percent-input" min="0" max="100" step="1" value="${currentPercent}" placeholder="e.g. 50" style="width:100%;height:38px;padding:0 32px 0 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none;" required autofocus>
        <span style="position:absolute;right:12px;color:#6b7280;font-weight:600;font-size:14px;pointer-events:none;">%</span>
      </div>
    </div>
  </form>
 `,`${cancelBtn}<button class="btn primary" id="confirm-in-progress">Submit</button>`,false,'sm');

 let input=document.getElementById('progress-percent-input');
 let form=document.getElementById('progress-form');
 let submitAction=()=>{
  let val=input?parseInt(input.value,10):50;
  if(isNaN(val)||val<0)val=0;
  if(val>100)val=100;
  t.status='In progress';
  t.percent=val;
  delete t.reason;
  t.declined=false;
  log('Task set in progress',t.title);
  save();
  closeDialog();
  render();
  toast(`“${t.title}” set to In progress (${val}%).`);
 };
 if(form)form.onsubmit=e=>{e.preventDefault();submitAction();};
 let confirmBtn=document.getElementById('confirm-in-progress');
 if(confirmBtn)confirmBtn.onclick=submitAction;
 if(input){setTimeout(()=>input.select(),50);}
}
function legacyPersonForm(p){showDialog(p?'Manage employee':'Add employee',`<form id="person-form"><div class="field"><label for="person-name">Full name</label><input id="person-name" name="name" value="${esc(p?.name||'')}" required></div><div class="field"><label for="person-email">Email</label><input id="person-email" name="email" type="email" value="${esc(p?.email||'')}" required></div><div class="form-grid"><div class="field"><label for="person-role">Role</label><select id="person-role" name="role">${Object.keys(navs).map(r=>`<option ${p?.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label for="person-business">Business</label><select id="person-business" name="business">${['Workforce Resourcing','Outsourcing'].map(r=>`<option ${p?.business===r?'selected':''}>${r}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label for="person-unit">Unit</label><select id="person-unit" name="unit">${['Recruitment','Assessment','Background Check','CSP','Payroll'].map(r=>`<option ${p?.unit===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label for="person-manager">Line manager</label><select id="person-manager" name="manager"><option value="">Select manager</option>${['Tunde Bakare','Nneka Obi','Emeka Nwosu'].map(r=>`<option ${p?.manager===r?'selected':''}>${r}</option>`).join('')}</select></div></div>${p?`<div class="field"><label for="person-status">Account status</label><select id="person-status" name="status">${['Active','On leave','Inactive'].map(r=>`<option ${p.status===r?'selected':''}>${r}</option>`).join('')}</select></div><small class="muted">Past weeks retain ${esc(p.manager)} as the manager at the time.</small>`:'<div class="banner gray">'+icon('mail')+' In the live platform, saving sends an invitation email.</div>'}<div class="error-text" id="form-error" role="alert"></div></form>`,`${cancelBtn}<button class="btn primary" form="person-form">${p?'Save changes':'Add function reportPreview(type='Organisation-wide',period='October 2026',format='PDF'){let ts=state.role==='Business Director'?tasks.filter(t=>people.find(p=>p.name===t.employee)?.business==='Workforce Resourcing'):tasks;showDialog('Report preview',`<div id="report-preview">${logo()}<div class="eyebrow" style="margin-top:30px">Weekly performance report</div><h1>${esc(type)} performance</h1><p class="muted" style="margin-top:8px">${esc(period)} · Generated 19 Oct 2026 · Sample data</p><div class="banner mt">${icon('info')} How to read this report: only approved completions count. Awaiting approvals and leave weeks are identified separately.</div><div class="two-col"><div class="metric"><span class="muted small">Sample tasks</span><div class="metric-value">${ts.length}</div></div><div class="metric"><span class="muted small">Approved completed</span><div class="metric-value">${ts.filter(t=>t.status==='Completed').length}</div></div></div><h2 class="mt">The work behind the numbers</h2>${ts.map(t=>`<div class="task-row" style="cursor:default"><div class="grow"><h3>${esc(t.title)}</h3><p>${esc(t.employee)}</p>${t.reason?`<p>${esc(t.reason)}</p>`:''}</div>${badge(t.status)}</div>`).join('')}<div class="banner teal mt">${icon('leave')} Femi Lawson · On leave 19–26 Oct · Excluded from rates.</div><p class="small muted">${format==='CSV'?'CSV downloads use the sample task records.':format==='PDF'?'Use your browser’s print dialog to save this preview as PDF.':format+' generation is a planned product integration; this prototype provides a preview and CSV export.'}</p></div>`,`<button class="btn" data-close>Close</button><button class="btn" id="report-csv">${icon('download')} Export CSV</button><button class="btn primary" id="report-print">${icon('file')} Print / save PDF</button>`);document.getElementById('report-csv').onclick=()=>exportTasks(ts);document.getElementById('report-print').onclick=()=>window.print()}
function csv(filename,rows){const text=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('CSV exported.')}

function legacyAction(a,id){let t=id?taskById(id):null;switch(a){case'add-task':taskForm();break;case'edit-task':taskForm(t);break;case'delete-task':confirmDelete(t);break;case'in-progress':confirmInProgress(t);break;case'completed':confirmComplete(t);break;case'blocked-next':blockedNext(t);break;case'approve':decide(t,true);break;case'decline':decide(t,false);break;case'hold':showDialog('Put on hold or cancel',`<form id="hold-form"><div class="field"><label for="hold-status">Status</label><select id="hold-status" name="status"><option>On hold</option><option>Cancelled</option></select></div><div class="field"><label for="hold-reason">Reason</label><textarea id="hold-reason" name="reason" required minlength="10"></textarea></div></form>`,`${cancelBtn}<button class="btn primary" form="hold-form">Save</button>`);document.getElementById('hold-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);t.status=f.get('status');t.reason=f.get('reason');log('Task '+t.status.toLowerCase(),t.title);closeDialog();render();toast('Task updated.')};break;case'prev':state.week=Math.max(-3,state.week-1);render();break;case'next':state.week=Math.min(1,state.week+1);render();break;case'today':state.week=0;state.read=false;render();break;case'notifications':state.notifications=!state.notifications;render();break;case'read-all':state.unread=0;render();break;case'return':case'cancel-leave':state.leave=null;log(a==='return'?'Returned from leave':'Leave cancelled',identity().name);render();toast('Leave ended. Welcome back.');break;case'edit-relief':state.relief=null;save();render();break;case'end-relief':state.relief=null;log('Relief assignment ended','Tunde Bakare');closeDialog();render();toast('Relief arrangement ended.');break;case'hr-relief':showDialog('Relief officer override',reliefForm(),cancelBtn);bindForms();break;case'add-person':personForm();break;case'lock-planning':state.scenario='closed';state.unlocks=[];log('Tracker locked','Week 43');render();toast('Tracker locked for Week 43.');break;case'back-team':navigate(state.role==='Line Manager'?'My team':'Performance records');break;case'director-team':navigate('Performance records');break;case'drill-reset':state.drill=[];render();break;case'export-records':exportTasks();break;case'export-audit':csv('workforce-audit-sample.csv',[['Time','User','Action','Target'],...state.audit.map(x=>[x.time,x.user,x.action,x.target])]);break;case'generate-report':document.getElementById('report-type')?.focus();document.getElementById('report-form')?.scrollIntoView({block:'center',behavior:'smooth'});break;case'bulk-approve':{let ts=tasks.filter(t=>t.status==='Awaiting approval');showDialog('Review completions for approval',`<p class="muted mb">Select the tasks you have reviewed and want to approve.</p><form id="bulk-form">${ts.map(t=>`<label class="flex" style="padding:14px 0;border-bottom:1px solid var(--line)"><input type="checkbox" name="task" value="${t.id}"><span><b class="small">${esc(t.title)}</b><br><small class="muted">${esc(t.employee)}</small></span></label>`).join('')}<div id="form-error" class="error-text" role="alert"></div></form>`,`${cancelBtn}<button class="btn success" form="bulk-form">Approve selected</button>`);document.getElementById('bulk-form').onsubmit=e=>{e.preventDefault();let ids=new FormData(e.target).getAll('task').map(Number);if(!ids.length)return formError('Select at least one task.');ids.forEach(id=>{let t=taskById(id);t.status='Completed';log('Completion approved',t.title)});closeDialog();render();toast(ids.length+' completions approved.')};break}case'password':passwordDialog();break;case'signout':state.auth=false;render();break;case'reset':showDialog('Reset the prototype?',`<p class="muted">This restores sample tasks and clears your local demo changes.</p>`,`${cancelBtn}<button class="btn primary" id="confirm-reset">Reset demo</button>`);document.getElementById('confirm-reset').onclick=()=>{localStorage.removeItem('wf-prototype-v1');location.reload()};break}}

function formatUnlockTimer(ms){
 if(ms<=0)return '00:00';
 let totalSec=Math.max(0,Math.floor(ms/1000));
 let h=Math.floor(totalSec/3600);
 let m=Math.floor((totalSec%3600)/60);
 let s=totalSec%60;
 let pad=n=>String(n).padStart(2,'0');
 if(h>0){
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
 }
 return `${pad(m)}:${pad(s)}`;
}

  }else{

  }
});root.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewEmployee(b.dataset.review));root.querySelectorAll('[data-review-approve]').forEach(b=>b.onclick=()=>decide(taskById(b.dataset.reviewApprove),true));root.querySelectorAll('[data-review-decline]').forEach(b=>b.onclick=()=>decide(taskById(b.dataset.reviewDecline),false));root.querySelectorAll('[data-approve-person]').forEach(b=>b.onclick=()=>{let ts=tasks.filter(t=>t.employee===b.dataset.approvePerson&&t.status==='Awaiting approval');ts.forEach(t=>{t.status='Completed';t.percent=100;t.approver='Tunde Bakare';t.approvedOn='2026-10-19';log('Completion approved',t.title)});render();reviewEmployee(b.dataset.approvePerson);toast(ts.length+' tasks approved.')});root.querySelectorAll('[data-remind]').forEach(b=>b.onclick=()=>{log('Reminder simulated',b.dataset.remind);toast('Reminder preview for '+b.dataset.remind+'. No email is sent.')});root.querySelectorAll('[data-carry]').forEach(b=>b.onclick=()=>{let t=taskById(b.dataset.carry);t.carry=true;log('Carry-over selected',t.title);render();toast('Carry-over flagged for next week.')});root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>confirmDelete(taskById(b.dataset.remove)));root.querySelectorAll('[data-date-target]').forEach(b=>b.onclick=()=>dateRange(b.dataset.dateTarget));root.querySelectorAll('[data-history-person]').forEach(b=>b.onclick=()=>{state.historyStatus='All statuses';state.historyRange=null;state.historyPage=1;employeeHistory(b.dataset.historyPerson)});root.querySelectorAll('[data-record]').forEach(b=>{b.onclick=()=>frozenRecord(people.find(p=>p.id===Number(b.dataset.record)));b.onkeydown=e=>{if(e.key==='Enter')b.click()}});root.querySelectorAll('[data-employee-menu]').forEach(b=>b.onclick=()=>employeeActions(people.find(p=>p.id===Number(b.dataset.employeeMenu)),b));root.querySelectorAll('[data-person-edit]').forEach(b=>b.onclick=()=>personForm(people.find(p=>p.id===Number(b.dataset.personEdit))));root.querySelectorAll('[data-manager-change]').forEach(b=>b.onclick=()=>managerChange(people.find(p=>p.id===Number(b.dataset.managerChange))));root.querySelectorAll('[data-deactivate]').forEach(b=>b.onclick=()=>deactivate(people.find(p=>p.id===Number(b.dataset.deactivate))));root.querySelectorAll('[data-page-step]').forEach(b=>b.onclick=()=>{let key=b.dataset.table==='history'?'historyPage':'pageNo';state[key]+=Number(b.dataset.pageStep);if(key==='historyPage')employeeHistory(state.historyPerson);else render()});root.querySelectorAll('[data-unit-toggle]').forEach(b=>b.onclick=()=>{state.expandedUnit=state.expandedUnit===b.dataset.unitToggle?null:b.dataset.unitToggle;render()});root.querySelectorAll('[data-unit-open]').forEach(b=>b.onclick=()=>{navigate('Units');state.expandedUnit=b.dataset.unitOpen;render()});root.querySelectorAll('[data-leave-tab]').forEach(b=>b.onclick=()=>{state.leaveTab=b.dataset.leaveTab;render()});root.querySelectorAll('[data-settings-tab]').forEach(b=>b.onclick=()=>{state.recordTab=b.dataset.settingsTab;state.pageNo=1;state.search='';render()});root.querySelectorAll('[data-timed-relock]').forEach(b=>b.onclick=()=>{let u=state.unlocks.splice(Number(b.dataset.timedRelock),1)[0];log('Tracker re-locked',u.target);render();unlockModal();toast('Tracker re-locked for '+u.target+'.')});root.querySelectorAll('[data-org-create]').forEach(b=>b.onclick=()=>orgEditor(b.dataset.orgCreate,b.dataset.business));root.querySelectorAll('[data-org-menu]').forEach(b=>b.onclick=()=>orgActions(b.dataset.orgMenu,b));root.querySelectorAll('[data-structure-edit]').forEach(b=>b.onclick=()=>orgEditor(orgStructure.some(o=>o.name===b.dataset.structureEdit)?'Business':'Unit',null,b.dataset.structureEdit));root.querySelectorAll('[data-structure-deactivate]').forEach(b=>b.onclick=()=>deactivateOrg(b.dataset.structureDeactivate));root.querySelectorAll('[data-report-format]').forEach(b=>b.onclick=()=>reportPreview(state.role==='Business Director'?'Business':'Organisation-wide',b.dataset.period,b.dataset.reportFormat));document.getElementById('history-status')?.addEventListener('change',e=>{state.historyStatus=e.target.value;state.historyPage=1;employeeHistory(state.historyPerson)});}
function newAction(a){switch(a){case'login':state.auth=false;render();break;case'date-range':dateRange();break;case'clear-range':state.range=null;render();break;case'clear-history-range':state.historyRange=null;employeeHistory(state.historyPerson);break;case'filters':state.filtersOpen=!state.filtersOpen;render();break;case'clear-filters':state.filter='All statuses';state.range=null;render();break;case'dismiss-attention':document.getElementById('attention-card')?.remove();break;case'unlock':unlockModal();break;case'generate-report':generateReportModal();break;case'all-missing':showDialog('Employees yet to submit',`${missingTable(pendingRoster)}${pagination(pendingRoster.length)}`,`<button class="btn" data-close>Close</button><button class="btn primary" id="remind-all">${icon('bell')} Remind all 16</button>`);document.getElementById('remind-all').onclick=()=>{log('Reminder to all simulated','16 employees');toast('16 reminder previews created. No emails are sent.')};break;case'edit-hr-relief':showDialog('Edit relief arrangement',reliefForm(),cancelBtn);bindForms();break;case'remove-hr-relief':if(state.relief)state.reliefHistory.push(state.relief);state.relief=null;log('Relief arrangement removed','HR override');render();toast('Relief arrangement removed.');break}}

function action(a,id){if(handleLeaveAction(a))return;if(a==='prev'||a==='next'){state.week+=a==='prev'?-1:1;state.pageNo=1;render();return}if(a==='today'){state.week=0;state.range=null;state.read=false;render();return}if(a==='return'||a==='cancel-leave'){let l=state.leave;state.leave=null;log('Returned from leave',l?.name||identity().name);render();toast('Welcome back. Your tracker is active again.');return}if(a==='edit-relief'){state.relief=null;state.leaveTab='Relief officer';render();return}if(a==='end-relief'){if(state.relief)state.reliefHistory.push(state.relief);state.relief=null;log('Relief assignment ended','Tunde Bakare');closeDialog();render();toast('Relief arrangement ended.');return}if(a==='reset'){showDialog('Reset the v1.2 demo?',`<p class="muted">Restore sample records and clear this prototype’s local changes.</p>`,`${cancelBtn}<button class="btn primary" id="confirm-reset">Reset demo</button>`);document.getElementById('confirm-reset').onclick=()=>{localStorage.removeItem('wf-prototype-v12');location.reload()};return}legacyAction(a,id)}

function taskRate(ts){let eligible=ts.filter(t=>t.status!=='Awaiting approval'&&t.status!=='Cancelled');return eligible.length?Math.round(eligible.filter(t=>t.status==='Completed').length/eligible.length*100):0}

let actionMenuAnchor=null;
function closeActionMenu(restoreFocus=true){
 document.getElementById('row-action-menu')?.remove();
 let anchor=actionMenuAnchor;actionMenuAnchor=null;
 anchor?.setAttribute('aria-expanded','false');
 if(restoreFocus&&anchor?.isConnected)anchor.focus();
}
function openActionMenu(anchor,content){
 if(actionMenuAnchor===anchor&&document.getElementById('row-action-menu')){closeActionMenu();return}
 closeActionMenu(false);if(!anchor?.isConnected)return;
 actionMenuAnchor=anchor;
 const menu=document.createElement('div');menu.id='row-action-menu';menu.className='row-action-menu action-menu';menu.setAttribute('role','menu');menu.setAttribute('aria-label',anchor.getAttribute('aria-label')||'Actions');menu.innerHTML=content;
 document.body.append(menu);anchor.setAttribute('aria-expanded','true');anchor.setAttribute('aria-haspopup','menu');
 bindCommon(menu);bindNew(menu);
 const buttons=[...menu.querySelectorAll('button')];
 buttons.forEach(b=>{b.setAttribute('role','menuitem');const perform=b.onclick;b.onclick=e=>{closeActionMenu(false);perform?.call(b,e)}});
 const r=anchor.getBoundingClientRect(),m=menu.getBoundingClientRect(),edge=12;
 const left=Math.max(edge,Math.min(r.right-m.width,window.innerWidth-m.width-edge));
 let top=r.bottom+6;if(top+m.height>window.innerHeight-edge)top=r.top-m.height-6;
 menu.style.left=left+'px';menu.style.top=Math.max(edge,top)+'px';
 menu.onkeydown=e=>{const i=buttons.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeActionMenu()}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[next]?.focus()}else if(e.key==='Tab')closeActionMenu(false)};
 buttons[0]?.focus();
}
document.addEventListener('pointerdown',e=>{const menu=document.getElementById('row-action-menu');if(menu&&!menu.contains(e.target)&&!actionMenuAnchor?.contains(e.target))closeActionMenu(false)});
window.addEventListener('resize',()=>closeActionMenu(false));
document.addEventListener('pointerdown',e=>{if(state.unlockDropdownOpen&&!e.target.closest('.unlock-dropdown-wrapper')){state.unlockDropdownOpen=false;render();}});
document.addEventListener('scroll',e=>{if(!document.getElementById('row-action-menu')?.contains(e.target))closeActionMenu(false)},true);

document.addEventListener('keydown',e=>{let dialog=document.querySelector('.dialog');if(!dialog)return;if(e.key==='Escape')closeDialog();if(e.key==='Tab'){let focusable=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(el=>!el.disabled&&el.offsetParent!==null),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});window.addEventListener('offline',()=>{let div=document.createElement('div');div.className='offline';div.id='offline-banner';div.textContent='You’re offline. Changes are saved on this device only.';document.body.append(div)});window.addEventListener('online',()=>document.getElementById('offline-banner')?.remove());
