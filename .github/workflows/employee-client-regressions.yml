name: Employee client regressions

on:
  pull_request:
  push:
    branches: [staging, main, 'codex/**']

jobs:
  greptile-regressions:
    name: Greptile P1/P2 client fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # prisma.config.ts reads DATABASE_URL_UNPOOLED at config-eval time
      # (postinstall runs `prisma generate`). These client regressions do
      # not need a live database, so a harmless placeholder URL is enough.
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Lint and production typecheck/build gate
        run: npm run check
      - name: Client regressions for Greptile findings 1-6
        run: npm run test:employee:client
      - name: Accessibility unit regressions
        run: npm run test:a11y:unit
